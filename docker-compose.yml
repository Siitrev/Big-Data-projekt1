# Lokalna baza MongoDB dla notebooka nyc_fhvhv_mongodb.ipynb
# Uruchomienie:  docker compose up -d
# Zatrzymanie:   docker compose down        (dane zostają w wolumenie)
# Usunięcie danych: docker compose down -v

services:
  mongo:
    image: mongo:8
    container_name: mongo-nyc-taxi
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: ["--wiredTigerCacheSizeGB", "4"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
    name: mongo-nyc-taxi-data
